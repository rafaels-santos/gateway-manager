name: Publish container

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        platform: [amd64, arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/check_repository.py
      - run: docker compose config --quiet
      - run: python tools/generate_compose.py --output compose.ci.local.yml && docker compose -f compose.ci.local.yml config --quiet
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/navigation.test.cjs
      - run: node --check static/app.js && node --check static/network.js && node --check static/network-actions.js && node --check static/navigation-model.js && node --check static/navigation.js
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.platform }}
          load: true
          tags: gateway-manager:smoke
      - name: Start and verify container
        shell: bash
        run: |
          set -eu
          docker volume create gateway-manager-test
          docker run -d --name gateway-manager-test --platform linux/${{ matrix.platform }} --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m --security-opt no-new-privileges --cap-drop ALL -p 127.0.0.1:18080:8080 -v gateway-manager-test:/data gateway-manager:smoke
          trap 'docker logs gateway-manager-test; docker rm -f gateway-manager-test; docker volume rm gateway-manager-test' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/ -o /tmp/gateway-home; then break; fi
            sleep 1
          done
          grep -q 'Gateway Manager' /tmp/gateway-home
          curl --fail --silent http://127.0.0.1:18080/app.js -o /dev/null
          curl --fail --silent http://127.0.0.1:18080/network.js -o /dev/null
          curl --fail --silent http://127.0.0.1:18080/network-actions.js -o /dev/null
          curl --fail --silent http://127.0.0.1:18080/navigation-model.js -o /dev/null
          curl --fail --silent http://127.0.0.1:18080/navigation.js -o /dev/null
          curl --fail --silent http://127.0.0.1:18080/api/connection-defaults | python -c 'import json,sys; value=json.load(sys.stdin); assert value["address"]=="" and not value["default_credentials_available"]'
          docker exec gateway-manager-test python -c "from pathlib import Path; p=Path('/data/smoke'); p.write_text('ok'); p.unlink()"
          test "$(docker inspect -f '{{.State.Running}}' gateway-manager-test)" = true
      - name: Verify generated Compose credentials inside container
        shell: bash
        run: |
          set -eu
          python - <<'PY'
          from tools.generate_compose import ROOT, render, write_private
          template=(ROOT/'docker-compose.yml').read_text(encoding='utf-8').replace('ghcr.io/rafaels-santos/gateway-manager:latest','gateway-manager:smoke')
          value=render(template,project='compose-credentials-test',port=8088,volume='gateway-manager-credentials-test',password='test-only$UNDEFINED_DOLLAR:"value')
          write_private(ROOT/'compose.credentials.local.yml',value)
          PY
          trap 'docker compose -f compose.credentials.local.yml down -v' EXIT
          docker compose -f compose.credentials.local.yml run --rm --no-deps --pull never --entrypoint python gateway-manager -c 'import os; assert os.environ["GATEWAY_PASSWORD"] == "test-only$UNDEFINED_DOLLAR:\"value"'
  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/rafaels-santos/gateway-manager:latest
            ghcr.io/rafaels-santos/gateway-manager:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/rafaels-santos/gateway-manager
