name: "${GATEWAY_MANAGER_PROJECT:-gateway-manager}"

services:
  gateway-manager:
    image: ghcr.io/rafaels-santos/gateway-manager:latest
    restart: unless-stopped
    init: true
    pull_policy: always
    ports:
      - "${GATEWAY_MANAGER_PORT:-8080}:8080"
    environment:
      DATA_DIR: /data
      PORT: "8080"
      PYTHONUNBUFFERED: "1"
      COOKIE_SECURE: "${COOKIE_SECURE:-0}"
      GATEWAY_ADDRESS: "${GATEWAY_ADDRESS:-}"
      GATEWAY_USERNAME: "${GATEWAY_USERNAME:-}"
      GATEWAY_PASSWORD: "${GATEWAY_PASSWORD:-}"
      GATEWAY_PASSWORD_FILE: "${GATEWAY_PASSWORD_FILE:-}"
      GATEWAY_MODEL: "${GATEWAY_MODEL:-huawei-eg8145x6-10}"
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    volumes:
      - gateway-manager-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=5).close()"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 30s

volumes:
  gateway-manager-data:
    name: "${GATEWAY_MANAGER_DATA_VOLUME:-gateway-manager-data}"

x-casaos:
  main: gateway-manager
  title:
    en_us: Gateway Manager
    pt_br: Gateway Manager
  category: Network
  scheme: http
  index: /
  port_map: "${GATEWAY_MANAGER_PORT:-8080}"
  icon: https://raw.githubusercontent.com/rafaels-santos/gateway-manager/master/static/icon.png
